[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agm-memory-mcp"
version = "0.1.4"
description = "AGM — Agent Memory Management. Provenance-tagged memory infrastructure for multi-agent AI systems. MCP server with trust scoring, behavioral fingerprinting, and memory poisoning defense."
readme = "README_PYPI.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Deep Shahane", email = "esotericdeep@gmail.com" }
]
keywords = [
    "mcp",
    "agm",
    "agent-memory",
    "ai-agents",
    "memory",
    "trust",
    "provenance",
    "multi-agent",
    "llm",
    "agent-security",
    "model-context-protocol",
    "memory-poisoning",
    "behavioral-fingerprinting",
    "trust-scoring"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0,<2",  # 2.x renamed FastMCP; server.py targets the 1.x API
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20"
]

[project.urls]
Homepage = "https://github.com/Deep-De-coder/agent-memory"
Documentation = "https://github.com/Deep-De-coder/agent-memory#readme"
Repository = "https://github.com/Deep-De-coder/agent-memory"
"Bug Tracker" = "https://github.com/Deep-De-coder/agent-memory/issues"

[project.scripts]
agm-memory-mcp = "agent_memory_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_memory_mcp*"]
exclude = ["tests*", "backend*", "frontend*"]

[tool.setuptools.package-data]
agent_memory_mcp = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly: newer ruff releases enable many more rules by default.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts that put the project root on sys.path before importing it.
"backend/tests/ablation_runner.py" = ["E402"]
"backend/tests/benchmark_minja.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
